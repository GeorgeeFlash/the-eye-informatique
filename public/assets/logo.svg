<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="teiBlueAsset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0035B9" />
    </linearGradient>
    <linearGradient id="teiRedAsset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A1A" />
      <stop offset="100%" stop-color="#D90429" />
    </linearGradient>
  </defs>

  <!-- Top Red Arc / Eyebrow -->
  <path
    d="M 180 50 Q 285 5 410 50 Q 300 30 180 50 Z"
    fill="url(#teiRedAsset)"
  />

  <!-- Main "Tei" Group -->
  <g id="tei-letters">
    <!-- Big Stylized Blue 'T' -->
    <path
      d="M 90 102 
         L 375 102 
         L 355 142 
         L 282 142 
         L 215 272 
         L 135 272 
         L 195 142 
         L 165 142 
         L 125 178 
         L 90 178 
         L 125 102 
         Z"
      fill="url(#teiBlueAsset)"
    />

    <!-- Stylized Red 'e' -->
    <path
      d="M 270 120
         C 220 120, 180 160, 180 205
         C 180 250, 225 275, 275 275
         C 308 275, 335 260, 350 235
         L 310 215
         C 298 230, 282 238, 265 238
         C 240 238, 222 225, 222 205
         L 352 205
         C 355 195, 358 178, 352 160
         C 342 135, 312 120, 270 120 Z
         M 226 175
         C 232 152, 252 145, 272 145
         C 292 145, 305 155, 305 175
         L 226 175 Z"
      fill="url(#teiRedAsset)"
    />

    <!-- Stylized Black 'i' -->
    <ellipse cx="380" cy="115" rx="16" ry="18" fill="#111827" transform="rotate(-15 380 115)" />
    <path
      d="M 368 152
         L 332 272
         L 375 272
         C 388 245, 402 215, 412 188
         C 422 165, 435 152, 448 152
         L 448 142
         C 422 142, 395 158, 380 175
         L 388 152
         Z"
      fill="#111827"
    />
  </g>

  <!-- Red Dynamic Bottom Underline / Swoosh -->
  <path
    d="M 100 286 
       Q 250 280 395 258
       Q 250 294 100 310
       Z"
    fill="url(#teiRedAsset)"
  />

  <!-- Subtitle: "The Eye Informatique" -->
  <text
    x="250"
    y="312"
    text-anchor="middle"
    font-family="'Brush Script MT', 'Dancing Script', 'Segoe Script', 'Great Vibes', 'Comic Sans MS', cursive, sans-serif"
    font-size="28"
    font-weight="bold"
    font-style="italic"
    fill="#111827"
    letter-spacing="0.5"
  >The Eye Informatique</text>
</svg>
